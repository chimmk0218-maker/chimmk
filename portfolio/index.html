<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>CHIMMK - 高清版作品集</title>
  <style>
    @font-face {
      font-family: "Source Han Sans CN";
      src: url("../chimmk-cool-assets/fonts/SourceHanSansCN-Regular.woff2") format("woff2");
      font-display: swap;
      font-weight: 400;
    }
    @font-face {
      font-family: "Source Han Sans CN";
      src: url("../chimmk-cool-assets/fonts/SourceHanSansCN-Bold.woff2") format("woff2");
      font-display: swap;
      font-weight: 700;
    }
    :root {
      color-scheme: light;
      --ink: #07111f;
      --muted: #5d6674;
      --line: rgba(7,17,31,.12);
      --blue: #246bff;
      --surface: #f3f7ff;
      --page: #ffffff;
      --ease: cubic-bezier(.16,1,.3,1);
    }
    * { box-sizing: border-box; }
    html { background: var(--surface); }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 88% 0%, rgba(36,107,255,.10), transparent 30rem),
        var(--surface);
      font-family: "Source Han Sans CN", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      min-height: 72px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      padding: 12px clamp(18px, 4vw, 56px);
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .brand {
      justify-self: start;
      font-size: clamp(20px, 2vw, 28px);
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }
    .back {
      justify-self: end;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      padding: 0 18px;
      border: 1px solid rgba(36,107,255,.34);
      border-radius: 999px;
      color: var(--blue);
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      transition: transform .25s var(--ease), background .25s var(--ease);
    }
    .back:hover { transform: translateY(-1px); background: #edf4ff; }
    .back:active { transform: scale(.98); }
    .intro {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: clamp(24px, 4vw, 42px) 0 clamp(22px, 3vw, 34px);
    }
    .notice {
      max-width: none;
      margin: 0;
      color: var(--muted);
      font-size: clamp(13px, 1.4vw, 15px);
      line-height: 1.8;
    }
    @media (min-width: 1100px) {
      .notice {
        font-size: 13px;
        white-space: nowrap;
      }
    }
    .viewer {
      width: min(1440px, calc(100% - 36px));
      margin: 0 auto;
      padding-bottom: 100px;
    }
    .page {
      position: relative;
      margin: 0 0 clamp(18px, 3vw, 38px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--page);
      box-shadow: 0 24px 80px rgba(7,17,31,.09);
    }
    .page-media {
      position: relative;
      width: 100%;
      overflow: hidden;
      background:
        linear-gradient(100deg, rgba(224,233,247,.74) 20%, rgba(245,249,255,.95) 38%, rgba(224,233,247,.74) 56%);
      background-size: 200% 100%;
      animation: skeleton 1.5s ease-in-out infinite;
    }
    .page.is-loaded .page-media { animation: none; background: #fff; }
    .page img {
      display: block;
      width: 100%;
      height: auto;
      opacity: 0;
      transition: opacity .6s var(--ease);
      user-select: none;
      -webkit-user-drag: none;
    }
    .page.is-loaded img { opacity: 1; }
    #loadSentinel { height: 1px; }
    @keyframes skeleton {
      from { background-position: 120% 0; }
      to { background-position: -120% 0; }
    }
    @media (max-width: 680px) {
      .topbar {
        min-height: 64px;
        grid-template-columns: 1fr auto;
        padding-inline: 14px;
      }
      .title { display: none; }
      .back { min-height: 36px; padding-inline: 14px; font-size: 12px; }
      .intro,
      .viewer { width: calc(100% - 20px); }
      .intro { padding-top: 24px; }
      .page { margin-bottom: 12px; border-radius: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html" aria-label="返回 CHIMMK 主站">CHIMMK</a>
    <p class="title">高清版作品集</p>
    <a class="back" href="../index.html">返回主站</a>
  </header>

  <main>
    <section class="intro" aria-label="作品集使用提示">
      <p class="notice">*温馨提示：本人作品集以及本网站仅限用于招聘评估使用，恳请您收到评估完毕后立即协助永久删除，切勿留存、转发或公开，感谢您的理解与配合。</p>
    </section>

    <section class="viewer" aria-label="高清作品集页面">
      <div id="pages"></div>
      <div id="loadSentinel" aria-hidden="true"></div>
    </section>
  </main>

  <script src="manifest.js?v=20260727-gallery02"></script>
  <script>
    const pages = Array.isArray(window.PORTFOLIO_PAGES) ? window.PORTFOLIO_PAGES : [];
    const pagesRoot = document.getElementById('pages');
    const sentinel = document.getElementById('loadSentinel');
    const batchSize = 5;
    const assetVersion = '20260727-gallery02';
    let renderedCount = 0;
    let rendering = false;

    function createPage(page) {
      const figure = document.createElement('figure');
      figure.className = 'page';
      figure.setAttribute('aria-label', `作品集第 ${page.display} 页`);

      const media = document.createElement('div');
      media.className = 'page-media';
      media.style.aspectRatio = `${page.width} / ${page.height}`;

      const image = document.createElement('img');
      image.width = page.width;
      image.height = page.height;
      image.alt = `占美琪视觉设计作品集第 ${page.display} 页`;
      image.loading = page.display <= batchSize ? 'eager' : 'lazy';
      image.decoding = 'async';
      image.draggable = false;
      image.src = `../chimmk-cool-assets/portfolio-view-2026/${page.file}?v=${assetVersion}`;
      image.addEventListener('load', () => figure.classList.add('is-loaded'), { once: true });
      image.addEventListener('error', () => {
        figure.classList.add('is-loaded');
        media.textContent = `第 ${page.display} 页加载失败，请刷新后重试`;
      }, { once: true });

      media.appendChild(image);
      figure.append(media);
      return figure;
    }

    function renderNextBatch() {
      if (rendering || renderedCount >= pages.length) return;
      rendering = true;
      const fragment = document.createDocumentFragment();
      const nextCount = Math.min(renderedCount + batchSize, pages.length);
      for (let index = renderedCount; index < nextCount; index += 1) {
        fragment.appendChild(createPage(pages[index]));
      }
      pagesRoot.appendChild(fragment);
      renderedCount = nextCount;
      rendering = false;
    }

    const loadObserver = new IntersectionObserver((entries) => {
      if (entries.some((entry) => entry.isIntersecting)) renderNextBatch();
    }, { rootMargin: '1200px 0px' });

    document.querySelector('.viewer').addEventListener('contextmenu', (event) => {
      if (event.target.closest('.page')) event.preventDefault();
    });
    document.addEventListener('dragstart', (event) => {
      if (event.target instanceof HTMLImageElement) event.preventDefault();
    });

    renderNextBatch();
    loadObserver.observe(sentinel);
  </script>
</body>
</html>
